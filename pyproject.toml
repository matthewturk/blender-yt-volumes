[project]
name = "yt-volumes"
version = "0.2.0"
description = "Blender add-on: render yt datasets with yt_idv inside Cycles or EEVEE renders, depth-clipped and composited on F12."
readme = "README.md"
authors = [{ name = "Matthew Turk" }]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13,<3.14"
# Pinned to match the pip-installable `bpy` dev/test dependency below (bpy
# wheels track a specific CPython ABI per release). This constrains only the
# *dev/test* venv created by `uv sync` here -- the add-on's actual runtime is
# whatever Python your real Blender embeds; Blender never reads this file.
dependencies = [
    "numpy>=1.24",
]

[project.urls]
Repository = "https://github.com/matthewturk/blender-yt-volumes"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # PyPI-distributed Blender-as-a-Python-module, used ONLY for:
    #   - the empirical Z-pass verification script (scripts/verify_zpass.py)
    #   - unit tests that need real bpy datatypes (Image, Scene, etc.)
    # The add-on itself is loaded by *real* Blender at runtime, not by this
    # package. See README "Development & testing" for why the two are
    # different bpy's and how to point tests at your own Blender instead.
    "bpy==5.2.0",
    "openexr>=3.4.13",
]
# Optional -- `uv sync --group ytidv` on top of the default `dev` group --
# real yt_idv. 0.6.1 is the first release with the scene transforms and
# texture atlas this relies on.
ytidv = [
    "yt_idv>=0.6.1",
    # yt.load_sample's Enzo/IsolatedGalaxy path lazy-imports these; not part
    # of yt_idv's own declared dependencies.
    "pooch>=1.8",
    "pandas>=2.0",
    "h5py>=3.10",
]

[tool.uv]
package = true

# To develop against a local yt_idv checkout:
# [tool.uv.sources]
# yt_idv = { path = "../yt_idv", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` strings
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
