# A two-shot dive into PopII_prime's biggest_scene.zip, authored with the
# Deep Zoom extension, rendered with yt isodensity shells.
#
#   python extensions/deep_zoom/grid_structure.py --scene /data/PopII_prime/biggest_scene.zip examples/popii_blocks.npz
#   python examples/make_deep_zoom_shots_blend.py examples/popii_dive.blend examples/popii_blocks.npz \
#       --dataset /data/PopII_prime/biggest_scene.zip --first-anchor bbox --zooms 1.3 8 9 --cut 150 --no-grid-map
#   python -m yt_volumes.render_volume examples/popii_dive.toml

[data]
scene = "/data/PopII_prime/biggest_scene.zip"

[blender]
file = "popii_dive.blend"
volume = "Volume"
extensions = ["../extensions/deep_zoom"]
frames = "1-240"
output = "../renders/popii_dive/frame_"
resolution = [1280, 720]
samples = 16
device = "OPTIX"

[render]
mode = "YT_IDV_YT_TRANSFER_FUNCTION"

[render.yt_idv]
yt_tf = "shells_tf.py:popii"
yt_tf_ray_length = 0.03
yt_tf_sample_factor = 8.0
