[project]
name = "cycles-volume-override"
version = "0.1.0"
description = "Blender add-on: per-object render-engine override (Cycles + external volume renderer), composited via depth-clipped Alpha Over."
readme = "README.md"
requires-python = ">=3.13,<3.14"
# Pinned to match the pip-installable `bpy` dev/test dependency below (bpy
# wheels track a specific CPython ABI per release). This constrains only the
# *dev/test* venv created by `uv sync` here -- the add-on's actual runtime is
# whatever Python your real Blender embeds; Blender never reads this file.
dependencies = [
    "numpy>=1.24",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # PyPI-distributed Blender-as-a-Python-module, used ONLY for:
    #   - the empirical Z-pass verification script (scripts/verify_zpass.py)
    #   - unit tests that need real bpy datatypes (Image, Scene, etc.)
    # The add-on itself is loaded by *real* Blender at runtime, not by this
    # package. See README "Development & testing" for why the two are
    # different bpy's and how to point tests at your own Blender instead.
    "bpy==5.2.0",
    "openexr>=3.4.13",
]
# Optional -- `uv sync --group ytidv` on top of the default `dev` group --
# real yt_idv, installed alongside `bpy` in this same Python-3.13 venv from a
# local checkout at ./yt_idv (gitignored; resolved via `[tool.uv.sources]`).
# yt_idv `main` has the depth clip (#247); subset scaling needs
# the scene transforms of yt-project/yt_idv#287, and #285 (bindless textures)
# is much faster. Until they merge, merge the open PRs onto main:
#
#     git clone https://github.com/yt-project/yt_idv.git yt_idv && cd yt_idv
#     for pr in 284 285 286 287 288; do git fetch origin pull/$pr/head:pr-$pr; done
#     git switch -c integration main
#     for pr in 284 285 286 287 288; do git merge --no-edit pr-$pr; done
#
# #287 conflicts with #284/#285 in block_collection.py and opengl_support.py;
# keep both sides, and have viewpoint_order() pass camera.position through
# _tree_viewpoint().
#
# The install is not editable: after changing the checkout, run
# `uv sync --group ytidv --reinstall-package yt_idv`.
ytidv = [
    "yt_idv",
    # yt.load_sample's Enzo/IsolatedGalaxy path lazy-imports these; not part
    # of yt_idv's own declared dependencies.
    "pooch>=1.8",
    "pandas>=2.0",
    "h5py>=3.10",
]

[tool.uv]
package = true

[tool.uv.sources]
yt_idv = { path = "yt_idv" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
